include "application.conf"

pekko {

  remote {
    artery {
      canonical {
        port = 17355
        port = ${?REMOTE_CANONICAL_PORT}
      }
      bind {
        port = ""
      }
    }
  }

  management {
    http {
      hostname = "0.0.0.0"
      port = 7626
      port = ${?MANAGEMENT_HTTP_PORT}
      bind-hostname = "0.0.0.0"
      bind-port     = ""
    }
  }

  cluster.bootstrap {
    contact-point-discovery {
      service-name = "petstore-grpc-service"
      discovery-method = config
      required-contact-point-nr = 1
      required-contact-point-nr = ${?REQUIRED_CONTACT_POINTS}
    }
  }

  discovery {
    method = config
    config {
      services {
        "petstore-grpc-service" {
          endpoints = [
            {host = "grpc-server", port = 7626}
          ]
        }
      }
    }
  }
}

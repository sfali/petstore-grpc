include classpath("pet-store/application.conf")
app {

  grpc-settings {
    host = "0.0.0.0"
    host = ${?GRPC_HOST}
    port = 8080
    port = ${?GRPC_SERVICE_PORT}
    hard-termination-deadline = 10.seconds
  }
}

pekko {

  actor {
    serialization-bindings {
      "com.improving.petstore.domain.behaviour.protocols.CborSerializable" = jackson-cbor
    }
  }

  persistence {
    state {
      plugin = "pekko.persistence.r2dbc.state"
    }

    r2dbc {
      schema = "petstore"

      connection-factory {
        host = ${?POSTGRES_SERVER_HOST}
        database = ${?POSTGRES_SERVER_DATABASE}
        user = ${?POSTGRES_SERVER_USER}
        password = ${?POSTGRES_SERVER_PASSWORD}
      }
    }
  }

  management {
    http {
      hostname = "0.0.0.0"
      bind-hostname = "0.0.0.0"
      bind-port     = 8558
    }
  }
}

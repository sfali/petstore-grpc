services:
  flyway:
    image: flyway/flyway:11.3.1
    command: -configFiles=/flyway/conf/flyway.config -locations=filesystem:/flyway/sql -connectRetries=60 migrate
    volumes:
      - ${PWD}/infrastructure/sql:/flyway/sql
      - ${PWD}/infrastructure/flyway/docker-flyway.config:/flyway/conf/flyway.config
    depends_on:
      - postgres

  postgres:
    image: postgres:14.5
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ${PWD}:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=petstore
      - POSTGRES_PASSWORD=%LUj#3rC
      - POSTGRES_DB=petstore
      - PGDATA=/var/lib/postgresql/data/pgdata

  grpc-server:
    image: sfali23/petstore-grpc-service:0.1.0-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dconfig.resource=docker.conf
    depends_on:
      - postgres

  pekko-gateway-server:
    image: sfali23/petstore-pekko-gateway-service:0.1.0-SNAPSHOT
    ports:
      - "7070:8080"
    environment:
      - JAVA_OPTS=-Dconfig.resource=docker.conf
      - GRPC_HOST=grpc-server
      - REST_GATEWAY_PORT=8080 # Rest gateway running at port 8080
